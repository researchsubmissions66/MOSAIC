<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">MOSAIC shared latent space</title>
  <desc id="desc">Six representative pathology encoder spaces, rendered as distinct tissue patterns, align into one shared morphological manifold.</desc>

  <defs>
    <linearGradient id="alignment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.52" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="core" x1="0.12" y1="0.08" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="0.48" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <radialGradient id="coreGlow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.7" stop-color="#eef2ff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#c7d2fe" stop-opacity="0"/>
    </radialGradient>

    <pattern id="glands" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#fce7f3"/>
      <ellipse cx="10" cy="11" rx="8" ry="6" fill="#f9a8d4" stroke="#7e22ce" stroke-width="1.4"/>
      <ellipse cx="10" cy="11" rx="3.5" ry="2.4" fill="#fff7fb"/>
      <ellipse cx="31" cy="29" rx="7" ry="8" fill="#f0abfc" stroke="#6d28d9" stroke-width="1.3"/>
      <ellipse cx="31" cy="29" rx="2.8" ry="3.5" fill="#fff7fb"/>
      <circle cx="28" cy="7" r="1.8" fill="#4c1d95"/>
      <circle cx="8" cy="31" r="1.5" fill="#701a75"/>
    </pattern>
    <pattern id="nuclei" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#fdf2f8"/>
      <path d="M0 8 C8 2 14 15 23 8 S33 9 36 3" fill="none" stroke="#f9a8d4" stroke-width="5" opacity="0.72"/>
      <circle cx="6" cy="6" r="2.1" fill="#581c87"/>
      <circle cx="19" cy="9" r="1.7" fill="#7e22ce"/>
      <circle cx="26" cy="22" r="2.2" fill="#4c1d95"/>
      <circle cx="10" cy="24" r="1.6" fill="#86198f"/>
      <ellipse cx="18" cy="19" rx="1.8" ry="2.7" fill="#6b21a8" transform="rotate(-24 18 19)"/>
    </pattern>
    <pattern id="stroma" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#f5e8ff"/>
      <path d="M-5 14 C8 1 17 26 32 12 S51 12 53 4" fill="none" stroke="#c084fc" stroke-width="7" opacity="0.62"/>
      <path d="M-4 38 C9 22 18 46 32 31 S48 35 51 23" fill="none" stroke="#f0abfc" stroke-width="6" opacity="0.78"/>
      <ellipse cx="9" cy="10" rx="2" ry="3.4" fill="#5b21b6" transform="rotate(-38 9 10)"/>
      <ellipse cx="26" cy="23" rx="2" ry="3" fill="#701a75" transform="rotate(31 26 23)"/>
      <circle cx="39" cy="39" r="2" fill="#4c1d95"/>
    </pattern>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#312e81" flood-opacity="0.13"/>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#312e81" flood-opacity="0.16"/>
    </filter>

    <style>
      .alignment-path {
        fill: none;
        stroke: url(#alignment);
        stroke-width: 2.1;
        stroke-linecap: round;
        stroke-dasharray: 6 9;
        opacity: 0.62;
        animation: alignment-flow 13s linear infinite;
      }
      .encoder-label {
        fill: #64748b;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 1.7px;
        text-anchor: middle;
      }
      .scope-label {
        fill: #475569;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 2.2px;
        text-anchor: middle;
      }
      .orbit {
        transform-box: view-box;
        transform-origin: 480px 210px;
        animation: orbit-turn 30s linear infinite;
      }
      .pulse-node {
        transform-box: fill-box;
        transform-origin: center;
        animation: node-pulse 3.8s ease-in-out infinite;
      }
      .pulse-node:nth-child(2n) { animation-delay: -1.9s; }
      @keyframes alignment-flow { to { stroke-dashoffset: -150; } }
      @keyframes orbit-turn { to { transform: rotate(360deg); } }
      @keyframes node-pulse { 50% { opacity: 0.55; transform: scale(0.78); } }
      @media (prefers-reduced-motion: reduce) {
        .alignment-path, .orbit, .pulse-node { animation: none; }
      }
    </style>
  </defs>

  <text x="480" y="24" class="scope-label">18 MODEL-SPECIFIC REPRESENTATION SPACES</text>

  <g aria-hidden="true">
    <path class="alignment-path" d="M230 83 C320 84 355 132 398 174"/>
    <path class="alignment-path" d="M170 210 C275 210 330 210 385 210"/>
    <path class="alignment-path" d="M230 337 C320 336 355 288 398 246"/>
    <path class="alignment-path" d="M730 83 C640 84 605 132 562 174"/>
    <path class="alignment-path" d="M790 210 C685 210 630 210 575 210"/>
    <path class="alignment-path" d="M730 337 C640 336 605 288 562 246"/>

    <g filter="url(#nodeShadow)" transform="translate(174 82)">
      <polygon points="0,-55 48,-27 48,27 0,55 -48,27 -48,-27" fill="url(#glands)" stroke="#2563eb" stroke-width="2.4"/>
      <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" fill="none" stroke="#2563eb" stroke-opacity="0.22" stroke-width="1.2"/>
      <text x="0" y="79" class="encoder-label">ENCODER 01</text>
    </g>
    <g filter="url(#nodeShadow)" transform="translate(112 210)">
      <polygon points="0,-55 48,-27 48,27 0,55 -48,27 -48,-27" fill="url(#nuclei)" stroke="#0d9488" stroke-width="2.4"/>
      <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" fill="none" stroke="#0d9488" stroke-opacity="0.22" stroke-width="1.2"/>
      <text x="0" y="79" class="encoder-label">ENCODER 02</text>
    </g>
    <g filter="url(#nodeShadow)" transform="translate(174 338)">
      <polygon points="0,-55 48,-27 48,27 0,55 -48,27 -48,-27" fill="url(#stroma)" stroke="#0891b2" stroke-width="2.4"/>
      <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" fill="none" stroke="#0891b2" stroke-opacity="0.22" stroke-width="1.2"/>
      <text x="0" y="79" class="encoder-label">ENCODER 03</text>
    </g>
    <g filter="url(#nodeShadow)" transform="translate(786 82)">
      <polygon points="0,-55 48,-27 48,27 0,55 -48,27 -48,-27" fill="url(#nuclei)" stroke="#7c3aed" stroke-width="2.4"/>
      <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" fill="none" stroke="#7c3aed" stroke-opacity="0.22" stroke-width="1.2"/>
      <text x="0" y="79" class="encoder-label">ENCODER 04</text>
    </g>
    <g filter="url(#nodeShadow)" transform="translate(848 210)">
      <polygon points="0,-55 48,-27 48,27 0,55 -48,27 -48,-27" fill="url(#stroma)" stroke="#9333ea" stroke-width="2.4"/>
      <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" fill="none" stroke="#9333ea" stroke-opacity="0.22" stroke-width="1.2"/>
      <text x="0" y="79" class="encoder-label">ENCODER 05</text>
    </g>
    <g filter="url(#nodeShadow)" transform="translate(786 338)">
      <polygon points="0,-55 48,-27 48,27 0,55 -48,27 -48,-27" fill="url(#glands)" stroke="#c026d3" stroke-width="2.4"/>
      <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" fill="none" stroke="#c026d3" stroke-opacity="0.22" stroke-width="1.2"/>
      <text x="0" y="79" class="encoder-label">ENCODER 06</text>
    </g>

    <circle cx="480" cy="210" r="132" fill="url(#coreGlow)"/>
    <g filter="url(#softShadow)">
      <circle cx="480" cy="210" r="98" fill="url(#core)" stroke="url(#alignment)" stroke-width="3"/>
      <circle cx="480" cy="210" r="82" fill="#ffffff" fill-opacity="0.78" stroke="#c7d2fe" stroke-width="1" stroke-dasharray="3 6"/>
    </g>

    <g class="orbit">
      <circle class="pulse-node" cx="480" cy="119" r="5" fill="#2563eb"/>
      <circle class="pulse-node" cx="559" cy="165" r="5" fill="#7c3aed"/>
      <circle class="pulse-node" cx="559" cy="255" r="5" fill="#c026d3"/>
      <circle class="pulse-node" cx="480" cy="301" r="5" fill="#0d9488"/>
      <circle class="pulse-node" cx="401" cy="255" r="5" fill="#0891b2"/>
      <circle class="pulse-node" cx="401" cy="165" r="5" fill="#4f46e5"/>
    </g>

    <g opacity="0.78">
      <path d="M438 240 L438 181 L480 222 L522 181 L522 240" fill="none" stroke="url(#alignment)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="438" cy="181" r="6" fill="#2563eb"/>
      <circle cx="480" cy="222" r="6" fill="#7c3aed"/>
      <circle cx="522" cy="181" r="6" fill="#0d9488"/>
      <circle cx="438" cy="240" r="4.5" fill="#0891b2"/>
      <circle cx="522" cy="240" r="4.5" fill="#c026d3"/>
    </g>

    <g transform="translate(480 326)">
      <rect x="-92" y="-15" width="184" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe"/>
      <circle cx="-72" cy="0" r="4" fill="#7c3aed"/>
      <text x="-58" y="4" class="encoder-label" style="font-size:9.5px; fill:#3730a3; text-anchor:start;">SHARED LATENT SPACE</text>
    </g>
  </g>

  <text x="480" y="408" class="scope-label">12 PATCH ENCODERS · 6 SLIDE ENCODERS</text>
</svg>
